d\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte D — Protocolos de apoio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 18<\u002Fdiv>\n    <div class=\"h1\">Entrega de chaves e proteção de comissão<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"regra-mae\" style=\"margin-bottom:20px;\">\n      <div class=\"regra-mae-lbl\">Regra de entrega de chaves<\u002Fdiv>\n      <div class=\"regra-mae-text\">Sem recebimento total pelo vendedor, não há entrega de chaves.<br>Isso vale para qualquer tipo de operação.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">18.1 — Em venda financiada, vendedor só recebe após:<\u002Fdiv>\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\">Assinatura do contrato bancário<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\">Pagamento do ITBI<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\">Termo de quitação da prefeitura<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\">Registro em cartório (presencial) ou pela ONR (e-Notariado)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\">Envio ao banco e análise<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\">Transferência do banco ao vendedor<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"h2\">18.2 — Critérios de comissão protegida<\u002Fdiv>\n    <ul class=\"checklist\">\n      <li><div class=\"chk\"><\u002Fdiv>Ficha da Seção 6 registrada<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Contrato (quando houver) conferido pelo Jurídico/Financeiro antes da assinatura<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Valor, forma e prazo de comissão claros no contrato<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Dados corretos da Jampalife e da imobiliária<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Canal de emissão de nota fiscal definido<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Contato direto com quem negociou (especialmente em construtora)<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"stop-box\" style=\"margin-top:12px;\">\n      <div class=\"stop-lbl\">Se um desses critérios falhar<\u002Fdiv>\n      <div class=\"stop-body\">O Corretor comunica o Gerente Sunrise(Junior) imediatamente.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 18<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE E OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte E<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte E — Ferramentas rápidas\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">E<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte E · Seções 19–20<\u002Fdiv>\n    <div class=\"sec-title\">Ferramentas de consulta rápida<\u002Fdiv>\n    <div class=\"sec-desc\">Checklists por tipo de operação e modelos prontos de mensagens. Use quando estiver em campo. Copie, adapte, envie. Sem reinventar a roda.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">19<\u002Fspan><span class=\"ss-text\">Checklists operacionais (por etapa e tipo)<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">20<\u002Fspan><span class=\"ss-text\">Modelos prontos de mensagens (16 modelos)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte E<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 19 -->\n<div class=\"page-block\" id=\"s19\">\n<div class=\"page-label\">Seção 19 · 1/2<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"19 Checklists (1/2)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte E — Ferramentas rápidas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 19<\u002Fdiv>\n    <div class=\"h1\">Checklists operacionais<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div>\n        <div class=\"h2\">19.1 — Antes de abrir grupo<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Ficha da Seção 6 preenchida<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Valor total, entrada e saldo claros<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Forma de pagamento definida<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Comprador e vendedor identificados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Imóvel, unidade e link definidos<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Sei se haverá financiamento<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Sei se haverá FGTS<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Sei se alguma parte está fora de JP<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Gerente Sunrise(Junior) informado<\u002Fli>\n        <\u002Ful>\n\n        <div class=\"h2\" style=\"margin-top:14px;\">19.2 — Grupo do comprador<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Nome no padrão · COMPRADOR<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Cliente comprador adicionado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Jurídico/Financeiro(Andressa) adicionado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Primeira mensagem com todos os dados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>FGTS mencionado, se for o caso<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <div class=\"h2\">19.3 — Grupo do vendedor<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Nome no padrão · VENDEDOR<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Vendedor adicionado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Jurídico/Financeiro(Andressa) adicionado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Valor total e saldo/financiado registrados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Vendedor sabe da dependência do banco<\u002Fli>\n        <\u002Ful>\n\n        <div class=\"h2\" style=\"margin-top:14px;\">19.4 — Venda à vista<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Grupos criados e primeira mensagem enviada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Documentação solicitada pelo Jurídico<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Promessa preparada e assinada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Localização das partes confirmada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>ITBI, escritura e registro acompanhados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Vendedor recebeu valor total antes das chaves<\u002Fli>\n        <\u002Ful>\n\n        <div class=\"h2\" style=\"margin-top:14px;\">19.6 — FGTS<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Financiamento habitacional ativo checado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Tempo de FGTS/registro checado (+3 anos)<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Imóvel no nome checado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Comprovante de residência checado (JP)<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Intenção de FGTS registrada no grupo<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Cliente avisado de que depende de validação<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 19 · 1/2<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\">\n<div class=\"page-label\">Seção 19 · 2/2<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"19 Checklists (2/2)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte E — Ferramentas rápidas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 19 · continuação<\u002Fdiv>\n    <div class=\"h1\">Checklists operacionais<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div>\n        <div class=\"h2\">19.5 — Financiamento bancário<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Simulação feita<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Documentos do comprador solicitados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Documentos do vendedor/imóvel solicitados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Carta de crédito enviada para análise<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Carta de crédito aprovada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Forma de pagamento da entrada registrada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Promessa assinada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Vistoria do engenheiro acompanhada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Formulários do banco preenchidos<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Localização das partes confirmada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Presencial ou e-Notariado definido<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>ITBI acompanhado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Registro acompanhado (cartório ou ONR)<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Liberação do banco ao vendedor acompanhada<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Chaves só após pagamento integral<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <div class=\"h2\">19.7 — Construtora<\u002Fdiv>\n        <ul class=\"checklist\">\n          <li><div class=\"chk\"><\u002Fdiv>Corretor domina produto, tabela e condições<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Cliente levado à construtora quando possível<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Jurídico/Financeiro(Andressa) informado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Dados da imobiliária solicitados ao Jurídico<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Documentos do comprador enviados<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Contrato recebido<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Contrato enviado para conferência antes da assinatura<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Comissão e forma de pagamento conferidas<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Contrato assinado enviado ao Jurídico<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>Contato da construtora enviado<\u002Fli>\n          <li><div class=\"chk\"><\u002Fdiv>NF e fluxo de comissão encaminhados<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 19 · 2/2<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 20 -->\n<div class=\"page-block\" id=\"s20\">\n<div class=\"page-label\">Seção 20 · Modelos 1/3<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"20 Modelos de mensagem (1 de 3)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte E — Ferramentas rápidas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 20<\u002Fdiv>\n    <div class=\"h1\">Modelos prontos de mensagens<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.3 · Confirmação da condição de entrada<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m3')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m3\">Só para deixar registrado e evitar dúvida:\n\nValor total do imóvel: R$\nEntrada total: R$\nPagamento na promessa de compra e venda: R$\nPagamento na assinatura do contrato bancário/escritura: R$\nValor financiado/saldo final: R$\n\nConfirmando essa condição, seguimos para a próxima etapa.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.4 · Carta de crédito aprovada<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m4')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m4\">Carta de crédito aprovada.\n\nValor total do imóvel: R$  |  Entrada total: R$  |  Valor financiado: R$\nPagamento na promessa: R$  |  Pagamento na assinatura: R$  |  Saldo via banco: R$\n\nConfirmando essas condições, seguimos para a próxima etapa documental.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.5 · Registro de uso de FGTS no grupo<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m5')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m5\">Registrando que o cliente comprador informou intenção de utilizar FGTS na operação.\n\nValor total: R$  |  Entrada: R$  |  Valor financiado: R$  |  FGTS previsto: R$\n\nO uso do FGTS ainda será validado conforme regras do banco e documentação do comprador.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.6 · Confirmação de localização das partes<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m6')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m6\">Para organizarmos a assinatura corretamente, preciso confirmar:\n\nTodos os compradores e vendedores estarão em João Pessoa para assinatura presencial?\n\nCaso alguém esteja fora, vamos verificar a possibilidade de assinatura por e-Notariado.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.7 · Alerta sobre prazo de banco/cartório<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m7')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m7\">Importante reforçar:\n\nOs prazos de banco, prefeitura, cartório e registro dependem das respectivas instituições.\n\nVamos acompanhar tudo de perto e informar cada avanço por aqui, mas evitamos prometer prazo fechado antes da confirmação oficial.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 20 · 1/3<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\">\n<div class=\"page-label\">Seção 20 · Modelos 2/3<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"20 Modelos de mensagem (2 de 3)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte E — Ferramentas rápidas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 20 · continuação<\u002Fdiv>\n    <div class=\"h1\">Modelos prontos de mensagens<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.8 · Alerta de assinatura com pouca antecedência<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m8')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m8\">Uma observação importante: o banco pode avisar a data de assinatura do contrato com pouca antecedência, às vezes um dia antes ou no próprio dia.\n\nPor isso, é importante que todos fiquem atentos às mensagens e à disponibilidade para assinar quando o banco liberar.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.9 · Pedido de documentação<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m9')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m9\">Para seguirmos com segurança na negociação, precisamos organizar a documentação abaixo.\n\nPode nos enviar por aqui, por favor?\n\n1.\n2.\n3.\n\nAssim conseguimos avançar sem atrasar a próxima etapa.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.10 · Documento ilegível ou incompleto<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m10')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m10\">Recebemos o documento, obrigado.\n\nPara conseguirmos usar no processo, precisamos que ele seja reenviado em melhor qualidade/completo, pois o arquivo atual está ilegível/incompleto.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.11 · Simulação ainda não é aprovação<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m11')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m11\">Vamos fazer uma simulação inicial para entender se valor do imóvel, entrada e financiamento ficam compatíveis com sua renda.\n\nEssa simulação ainda não é a aprovação final do banco, mas ajuda a confirmar se a negociação faz sentido antes de avançarmos com a documentação.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.12 · Venda com construtora em andamento (aviso interno)<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m12')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m12\">VENDA COM CONSTRUTORA EM ANDAMENTO\n\nEmpreendimento:  |  Unidade:  |  Construtora:\nCliente comprador:  |  Valor negociado:\nForma de pagamento:  |  Contato da construtora:\nContrato recebido: sim/não\nContrato enviado para conferência do Jurídico/Financeiro(Andressa): sim/não<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 20 · 2/3<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\">\n<div class=\"page-label\">Seção 20 · Modelos 3/3<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"20 Modelos de mensagem (3 de 3)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte E — Ferramentas rápidas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 20 · continuação<\u002Fdiv>\n    <div class=\"h1\">Modelos para uso interno<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.13 · Pedido de escalonamento<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m13')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m13\">ESCALONAMENTO\n\nCaso/negociação:\nCorretor responsável:\nO que aconteceu:\nO que já foi tentado:\nO que espero que seja decidido/feito:\nUrgência: alta / média / baixa<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.14 · Comunicação de problema operacional<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m14')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m14\">PROBLEMA IDENTIFICADO\n\nCaso/negociação:  |  Corretor responsável:\nO que aconteceu:\nImpacto na venda:\nQuem precisa agir:  |  Ação sugerida:  |  Prazo:<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.15 · Comunicação de decisão<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m15')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m15\">DECISÃO TOMADA\n\nAssunto:\nDecisão:\nResponsável por executar:  |  Prazo:\nQuem precisa ser avisado:\nEsse ponto precisa virar protocolo? sim/não<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">20.16 · Pendência documental<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('m16')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"m16\">PENDÊNCIA DOCUMENTAL\n\nNegociação:  |  Parte responsável pelo envio:\nDocumento pendente:  |  Prazo desejado:\nImpacto se não enviar:  |  Responsável por cobrar:<\u002Fdiv>\n    <\u002Fdiv>\n\n\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 20 · 3/3<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE F OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte F<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte F — Gestão e melhoria\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">F<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte F · Seções 21–25<\u002Fdiv>\n    <div class=\"sec-title\">Gestão, treinamento e melhoria<\u002Fdiv>\n    <div class=\"sec-desc\">Como o Gerente Sunrise treina o manual, como registrar e aprender com falhas, quando e como revisar, e o que a Jampalife espera alcançar com essa operação.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">21<\u002Fspan><span class=\"ss-text\">Como o Gerente Sunrise(Junior) treina este manual<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">22<\u002Fspan><span class=\"ss-text\">Como registrar falhas de protocolo<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">23<\u002Fspan><span class=\"ss-text\">Quando uma falha vira treinamento<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">24<\u002Fspan><span class=\"ss-text\">Revisão do manual<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">25<\u002Fspan><span class=\"ss-text\">Resultado esperado<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte F<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÕES 21–24 -->\n<div class=\"page-block\" id=\"s21\">\n<div class=\"page-label\">Seções 21–22<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"21 Treinamento — 22 Falhas de protocolo\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte F — Gestão, treinamento e melhoria<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 21<\u002Fdiv>\n    <div class=\"h1\">Como o Gerente Sunrise(Junior) treina este manual<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"h2\">Treinamento inicial — formato sugerido (90 min por sessão)<\u002Fdiv>\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\">Apresentar a regra mãe e a Parte A<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\">Explicar a Seção 5 — quando uma conversa vira negociação<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\">Praticar a ficha da Seção 6 com casos reais de corretores da equipe<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\">Simular abertura de grupo (Seção 7)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\">Rodar os quatro protocolos principais com casos abstratos simples<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\">Revisar a Seção 17 — o que o Corretor nunca faz<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">7<\u002Fdiv><div class=\"step-text\">Cada corretor confirma por escrito que entendeu<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"h2\" style=\"margin-top:12px;\">Acompanhamento semanal — por corretor<\u002Fdiv>\n    <ul class=\"bullet-list\">\n      <li>Quantas negociações abertas conforme ficha da Seção 6<\u002Fli>\n      <li>Se os grupos foram criados no padrão<\u002Fli>\n      <li>Se o Jurídico/Financeiro foi acionado com informação completa<\u002Fli>\n      <li>Quais falhas de protocolo aconteceram e quais foram repetidas<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\" style=\"margin-top:12px;\">Cadência<\u002Fdiv>\n    <ul class=\"bullet-list\">\n      <li><strong>Semanal<\u002Fstrong> — reunião da equipe com revisão de 1–2 casos reais<\u002Fli>\n      <li><strong>Mensal<\u002Fstrong> — encontro individual por corretor<\u002Fli>\n      <li><strong>Por reincidência<\u002Fstrong> — revisão do manual quando uma falha se repetir 3 vezes<\u002Fli>\n    <\u002Ful>\n\n    <div id=\"s22\" style=\"margin-top:22px;\">\n      <div class=\"sec-tag\">Seção 22<\u002Fdiv>\n      <div class=\"h1\">Como registrar falhas de protocolo<\u002Fdiv>\n      <div class=\"h1-rule\"><\u002Fdiv>\n      <div class=\"copy-block\">\n        <div class=\"copy-head\"><span class=\"copy-head-lbl\">Formulário de registro de falha · acumulativo por corretor<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('falha')\">Copiar<\u002Fspan><\u002Fdiv>\n        <div class=\"copy-body\" id=\"falha\">FALHA DE PROTOCOLO\n\nCorretor:  |  Data:  |  Negociação:\nProtocolo descumprido:\nO que aconteceu:  |  Impacto:\nOrientação dada:  |  Prazo para correção:\nReincidência: sim/não<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"body-p\" style=\"margin-top:8px;\">Esse registro serve de base para: ajuste individual no encontro mensal · evolução no Plano de Carreira (Bronze/Prata/Ouro) · decisão de treinamento coletivo (Seção 23) · decisão estratégica com CEO(David).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seções 21–22<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\" id=\"s23\">\n<div class=\"page-label\">Seções 23–24<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"23 Quando falha vira treinamento — 24 Revisão\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte F — Gestão, treinamento e melhoria<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 23<\u002Fdiv>\n    <div class=\"h1\">Quando uma falha vira treinamento<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"regra-mae\" style=\"margin-bottom:18px;\">\n      <div class=\"regra-mae-lbl\">Regra dos três<\u002Fdiv>\n      <div class=\"regra-mae-text\">Se uma mesma orientação precisou ser dada três vezes,<br>vira treinamento ou vira ajuste no manual.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body-p\">Uma falha individual vira pauta de treinamento coletivo quando:<\u002Fdiv>\n    <ul class=\"bullet-list\">\n      <li>Mais de um corretor comete o mesmo erro<\u002Fli>\n      <li>O mesmo corretor repete o erro<\u002Fli>\n      <li>O erro gera atraso em venda<\u002Fli>\n      <li>O erro sobrecarrega o Departamento Jurídico/Financeiro(Andressa)<\u002Fli>\n      <li>O erro gera risco de perder cliente<\u002Fli>\n      <li>O erro mostra que o protocolo não está claro o suficiente<\u002Fli>\n    <\u002Ful>\n\n    <div id=\"s24\" style=\"margin-top:28px;\">\n      <div class=\"sec-tag\">Seção 24<\u002Fdiv>\n      <div class=\"h1\">Revisão do manual<\u002Fdiv>\n      <div class=\"h1-rule\"><\u002Fdiv>\n\n      <div class=\"h2\">Quando revisar<\u002Fdiv>\n      <ul class=\"bullet-list\">\n        <li>Após os primeiros 30 dias de uso — revisão do piloto<\u002Fli>\n        <li>Quando uma falha se repetir três vezes<\u002Fli>\n        <li>Quando banco, cartório, prefeitura ou construtora mudarem regra relevante<\u002Fli>\n        <li>Quando o Jurídico/Financeiro identificar novo gargalo<\u002Fli>\n        <li>Quando o Gerente Sunrise(Junior) identificar dificuldade recorrente da equipe<\u002Fli>\n        <li>Quando o CEO(David) definir novo padrão operacional<\u002Fli>\n      <\u002Ful>\n\n      <div class=\"info-box\" style=\"margin-top:14px;\">\n        <div class=\"info-lbl\">Processo de revisão<\u002Fdiv>\n        <div class=\"info-body\">Proposta sai do Gerente Sunrise(Junior) ou do Jurídico/Financeiro(Andressa) → aprovação pelo CEO(David). O manual vivo é sempre a versão mais recente aprovada. Versões anteriores ficam arquivadas para referência.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hl-box\" style=\"margin-top:14px;\">\n        <div class=\"hl-lbl\">Responsabilidade<\u002Fdiv>\n        <div class=\"hl-body\">Nenhuma mudança entra em vigor sem aprovação do CEO(David). Mudanças aprovadas são comunicadas a toda a equipe pelo Gerente Sunrise(Junior) antes de entrarem em vigor.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seções 23–24<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 25 — ENCERRAMENTO -->\n<div class=\"page-block\" id=\"s25\">\n<div class=\"page-label\">Seção 25<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"25 Resultado esperado\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte F — Gestão, treinamento e melhoria<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"closing-body\">\n    <div class=\"sec-tag\">Seção 25<\u002Fdiv>\n    <div class=\"h1\">Resultado esperado<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Com este manual aplicado, a Jampalife consegue:<\u002Fdiv>\n\n    <div class=\"closing-grid\">\n      <div class=\"closing-card\"><div class=\"closing-num\">01<\u002Fdiv><div class=\"closing-text\">Reduzir retrabalho do Departamento Jurídico/Financeiro<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">02<\u002Fdiv><div class=\"closing-text\">Diminuir ruído entre corretor, comprador, vendedor e construtora<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">03<\u002Fdiv><div class=\"closing-text\">Padronizar grupos de WhatsApp em toda operação<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">04<\u002Fdiv><div class=\"closing-text\">Organizar documentação por tipo de operação<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">05<\u002Fdiv><div class=\"closing-text\">Proteger comissão em vendas com construtora<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">06<\u002Fdiv><div class=\"closing-text\">Reduzir dependência dos sócios em tarefas repetitivas<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">07<\u002Fdiv><div class=\"closing-text\">Dar mais autonomia ao Corretor<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">08<\u002Fdiv><div class=\"closing-text\">Dar mais clareza e critério ao Gerente Sunrise(Junior)<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">09<\u002Fdiv><div class=\"closing-text\">Melhorar a experiência do comprador, do vendedor e da construtora<\u002Fdiv><\u002Fdiv>\n      <div class=\"closing-card\"><div class=\"closing-num\">10<\u002Fdiv><div class=\"closing-text\">Preparar a operação para crescer até a meta de 50 corretores — Sunrise + Sunset<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"closing-frase\">\n      <div class=\"closing-frase-lbl\">Frase-guia Jampalife<\u002Fdiv>\n      <div class=\"closing-frase-text\">A Jampalife não cresce no improviso.<br>Cresce com Corretor treinado, negociação registrada,<br>grupo certo, documento certo e liderança acompanhando por dados.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife Negócios Imobiliários · Manual de Protocolo e Operações v2 · 2026<\u002Fspan><span class=\"ft-pg\">Seção 25 · Fim<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><!-- /main -->\n\n<script>\n// Sidebar active on scroll\nconst sections = document.querySelectorAll('[id]');\nconst links = document.querySelectorAll('.sidebar nav a');\nconst observer = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      links.forEach(l => l.classList.remove('active'));\n      const match = document.querySelector(`.sidebar nav a[href=\"#${e.target.id}\"]`);\n      if (match) match.classList.add('active');\n    }\n  });\n}, { threshold: 0.2 });\nsections.forEach(s => observer.observe(s));\n\n// Copy helpers\nfunction copyBlock(id) {\n  const el = document.getElementById(id);\n  if (el) navigator.clipboard.writeText(el.textContent.trim()).then(() => { });\n}\nfunction copyFicha() { copyBlock('ficha-text'); }\nfunction copyMsg1()  { copyBlock('msg1-text'); }\nfunction copyFGTS()  { copyBlock('fgts-text'); }\n\n// Checkbox toggle\ndocument.querySelectorAll('.chk').forEach(chk => {\n  chk.addEventListener('click', () => {\n    chk.style.background = chk.style.background === 'rgb(242, 194, 0)' ? 'white' : 'rgb(242, 194, 0)';\n  });\n});\n<\u002Fscript>\n<script>\n(function(){\n  var LOGO=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHMAAAKjCAYAAACeO0NiAACAAElEQVR4XuzdB5gkVbn/8RcQuYhehSsG5BpABEV9vAZULnoxcr2K+BdFVIygICjgEgSVjOSwLEtc2J3NOeec8+5shM07M8uSlt0ZQJC4O//znpqa6TmnelJ3dVV1f+t5Ps/0nK7uPnVO99ac357TJY2NjQIAAAAAAIBs8AoAAAAAAACQXl4BAAAAAAAA0ssrAAAAAAAAQHp5BQAAAAAAAEgvrwAAAAAAAADp5RUAAAAAAAAgvbwCAAAAAAAApJdXAAAAAAAAgPTyCgAAAAAAAJBeXgEAAAAAAADSyysAAAAAAABAenkFAAAAAAAASC+vAAAAAAAAAOnlFQAAAAAAACC9vAIAAAAAAACkl1cAAAAAAACA9PIKAAAAAAAAkF5eAQAAAAAAANLLKwAAAAAAAEB6eQUAAAAAAABIL68AAAAAAAAA6eUVAAAAAAAAIL28AgAAAAAAAKSXVwAAAAAAAID08goAAAAAAACQXl4BAAAAAAAA0ssrAAAAAAAAQHp5BQAAAAAAAEgvrwAAAAAAAADp5RUAAAAAAAAgvbwCAAAAAAAApJdXAAAAAAAAgPTyCgAAAAAAAJBeXgEAAAAAAADSyysAAAAAAABAenkFAAAAAAAASC+vAAAA
