  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

55;padding:10px 16px 3px;}\n.sidebar nav a{display:block;font-family:var(--f-body);font-size:10px;color:#888;text-decoration:none;padding:5px 16px;border-left:2px solid transparent;transition:all .15s;line-height:1.35;}\n.sidebar nav a:hover,.sidebar nav a.active{color:#fff;border-left-color:var(--c-gold);background:rgba(255,255,255,.04);}\n\n/* MAIN */\n.main{margin-left:186px;padding:36px 48px;display:flex;flex-direction:column;align-items:center;gap:56px;}\n.page-block{display:flex;flex-direction:column;align-items:center;gap:10px;width:var(--page-w);}\n.page-label{align-self:flex-start;font-family:var(--f-body);font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold);opacity:.7;}\n\n/* A4 */\n.a4{width:var(--page-w);min-height:var(--page-h);background:var(--c-bg-warm);position:relative;display:flex;flex-direction:column;box-shadow:0 4px 40px rgba(0,0,0,.5);overflow:hidden;}\n\n/* HEADER / FOOTER */\n.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:18px var(--mg) 14px;border-bottom:1px solid var(--c-rule);}\n.pg-hd-logo{height:56px;width:auto;}\n.pg-hd-info{text-align:right;}\n.pg-hd-info .doc-name{font-family:var(--f-body);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink-muted);}\n.pg-hd-info .doc-date{font-family:var(--f-body);font-size:8px;color:var(--c-ink-muted);margin-top:2px;}\n.pg-ft{margin-top:auto;}\n.pg-ft-info{display:flex;justify-content:space-between;align-items:center;padding:7px var(--mg);border-top:1px solid var(--c-rule-light);}\n.ft-text{font-family:var(--f-body);font-size:7.5px;color:var(--c-ink-muted);}\n.ft-pg{font-family:var(--f-body);font-size:7.5px;color:var(--c-ink-muted);}\n.pg-ft-bar{height:6px;background:var(--c-charcoal);display:flex;}\n.pg-ft-bar::before{content:'';display:block;width:40px;background:var(--c-gold);}\n\n/* COVER */\n.cover .cover-body{flex:1;display:flex;flex-direction:column;padding:0 var(--mg);}\n. div>\n\n    <div class=\"toc-part\">\n      <div class=\"toc-part-hd\">Parte C — Protocolos por tipo de operação · Seções 8–12<\u002Fdiv>\n      <div class=\"toc-items\">\n        <div class=\"toc-item\"><span class=\"toc-num\">8<\u002Fspan><span class=\"toc-text\">Fluxo comum a todas as operações<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">9<\u002Fspan><span class=\"toc-text\">Protocolo de venda à vista<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">10<\u002Fspan><span class=\"toc-text\">Venda com financiamento bancário<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">11<\u002Fspan><span class=\"toc-text\">Financiamento com FGTS<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">12<\u002Fspan><span class=\"toc-text\">Venda com construtora<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"toc-part\">\n      <div class=\"toc-part-hd\">Parte D — Protocolos de apoio · Seções 13–18<\u002Fdiv>\n      <div class=\"toc-items\">\n        <div class=\"toc-item\"><span class=\"toc-num\">13<\u002Fspan><span class=\"toc-text\">Documentação e captação<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">14<\u002Fspan><span class=\"toc-text\">Registro no C2S e no Tecimob<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">15<\u002Fspan><span class=\"toc-text\">Escalonamento<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">16<\u002Fspan><span class=\"toc-text\">Comunicação interna<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">17<\u002Fspan><span class=\"toc-text\">Regras inegociáveis<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">18<\u002Fspan><span class=\"toc-text\">Entrega de chaves e comissão<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"toc-part\">\n      <div class=\"toc-part-hd\">Parte E — Ferramentas rápidas · Seções 19–20<\u002Fdiv>\n      <div class=\"toc-items\">\n        <div class=\"toc-item\"><span class=\"toc-num\">19<\u002Fspan><span class=\"toc-text\">Checklists operacionais<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">20<\u002Fspan><span class=\"toc-text\">Modelos prontos de mensagens<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"toc-part\">\n      <div class=\"toc-part-hd\">Parte F — Gestão, treinamento e melhoria · Seções 21–25<\u002Fdiv>\n      <div class=\"toc-items\">\n        <div class=\"toc-item\"><span class=\"toc-num\">21<\u002Fspan><span class=\"toc-text\">Como o Gerente Sunrise treina este manual<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">22<\u002Fspan><span class=\"toc-text\">Como registrar falhas de protocolo<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">23<\u002Fspan><span class=\"toc-text\">Quando uma falha vira treinamento<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">24<\u002Fspan><span class=\"toc-text\">Revisão do manual<\u002Fspan><\u002Fdiv>\n        <div class=\"toc-item\"><span class=\"toc-num\">25<\u002Fspan><span class=\"toc-text\">Resultado esperado<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Sumário<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE A OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte A<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte A — Fundação\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">A<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte A · Seções 1–4<\u002Fdiv>\n    <div class=\"sec-title\">Fundação<\u002Fdiv>\n    <div class=\"sec-desc\">A base conceitual da operação. O que este manual é, para que serve, como usá-lo e quem faz o quê. Leia esta parte primeiro. Tudo que vem depois depende dela.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">1<\u002Fspan><span class=\"ss-text\">Objetivo deste manual<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">2<\u002Fspan><span class=\"ss-text\">Regra mãe da operação<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">3<\u002Fspan><span class=\"ss-text\">Como usar este manual — mapa rápido de decisão<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">4<\u002Fspan><span class=\"ss-text\">Papéis e responsabilidades<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte A<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÕES 1 + 2 -->\n<div class=\"page-block\" id=\"s1\">\n<div class=\"page-label\">Seção 1 · Seção 2<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"01 Objetivo — 02 Regra mãe\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte A — Fundação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 1<\u002Fdiv>\n    <div class=\"h1\">Objetivo deste manual<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Este manual define o <strong>padrão mínimo de operação da Jampalife<\u002Fstrong> em negociações imobiliárias. É operacional — não acadêmico.<\u002Fdiv>\n    <div class=\"body-p\">A regra de avaliação é simples: <strong>se uma orientação aqui não ajuda o corretor, o gerente ou o jurídico/financeiro a agir melhor amanhã de manhã, a orientação sai do manual.<\u002Fstrong><\u002Fdiv>\n\n    <div class=\"h2\">Serve para<\u002Fdiv>\n    <ul class=\"bullet-list\">\n      <li><strong>Corretor<\u002Fstrong> — saber o que fazer, quando fazer e com quem falar<\u002Fli>\n      <li><strong>Gerente Sunrise(Junior)<\u002Fstrong> — treinar, cobrar e acompanhar a equipe com critério objetivo<\u002Fli>\n      <li><strong>Departamento Jurídico/Financeiro(Andressa)<\u002Fstrong> — receber informação completa no momento certo, sem retrabalho<\u002Fli>\n      <li><strong>CEO(David)<\u002Fstrong> — ter base operacional clara para escalar a empresa<\u002Fli>\n      <li><strong>Novos colaboradores<\u002Fstrong> — entender o padrão da empresa em pouco tempo<\u002Fli>\n      <li><strong>Agentes de IA e LLMs internos<\u002Fstrong> — interpretar o fluxo operacional corretamente<\u002Fli>\n    <\u002Ful>\n\n    <div id=\"s2\" style=\"margin-top:28px;\">\n      <div class=\"sec-tag\">Seção 2<\u002Fdiv>\n      <div class=\"h1\">Regra mãe da operação<\u002Fdiv>\n      <div class=\"h1-rule\"><\u002Fdiv>\n\n      <div class=\"regra-mae\">\n        <div class=\"regra-mae-lbl\">A regra que governa tudo<\u002Fdiv>\n        <div class=\"regra-mae-text\">Negociação não fica solta no WhatsApp privado do corretor.<br>Quando a negociação começa, ela vira processo:<br>informação organizada, grupo certo, gestão avisada,<br>jurídico no momento certo, documento no lugar certo.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"h2\">Desdobramentos práticos<\u002Fdiv>\n      <ul class=\"bullet-list\">\n        <li>Se não estiver registrado no grupo, <strong>não aconteceu<\u002Fstrong><\u002Fli>\n        <li>Se faltar informação mínima, <strong>o Departamento Jurídico/Financeiro(Andressa) não é acionado<\u002Fstrong><\u002Fli>\n        <li>Se houver promessa de prazo que depende de terceiros, <strong>há risco de quebra de expectativa<\u002Fstrong><\u002Fli>\n        <li>Se houver entrega de chaves sem pagamento total, <strong>há risco de perda financeira para o vendedor<\u002Fstrong><\u002Fli>\n        <li>Se não houver conferência do Jurídico/Financeiro antes da assinatura com construtora, <strong>há risco de comissão desprotegida<\u002Fstrong><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seções 1–2<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 3 -->\n<div class=\"page-block\" id=\"s3\">\n<div class=\"page-label\">Seção 3<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"03 Mapa rápido de decisão\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte A — Fundação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 3<\u002Fdiv>\n    <div class=\"h1\">Como usar este manual — mapa rápido de decisão<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Em vez de ler o manual inteiro, o corretor usa este mapa para achar o que precisa.<\u002Fdiv>\n\n    <table class=\"doc-table\">\n      <thead><tr><th>Situação<\u002Fth><th>Onde ir<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Cliente só está em atendimento inicial<\u002Ftd><td>Seção 5 (ainda não é negociação)<\u002Ftd><\u002Ftr>\n        <tr><td>Cliente manifestou intenção real de compra<\u002Ftd><td>Seção 5 e Seção 6<\u002Ftd><\u002Ftr>\n        <tr><td>Valor e forma de pagamento já negociados<\u002Ftd><td>Seção 7 — abrir grupo<\u002Ftd><\u002Ftr>\n        <tr><td>Venda à vista<\u002Ftd><td>Seção 9<\u002Ftd><\u002Ftr>\n        <tr><td>Venda com financiamento bancário<\u002Ftd><td>Seção 10<\u002Ftd><\u002Ftr>\n        <tr><td>Comprador vai usar FGTS<\u002Ftd><td>Seção 11<\u002Ftd><\u002Ftr>\n        <tr><td>Venda direto com construtora<\u002Ftd><td>Seção 12<\u002Ftd><\u002Ftr>\n        <tr><td>Documento pendente ou ilegível<\u002Ftd><td>Seção 13<\u002Ftd><\u002Ftr>\n        <tr><td>Lead ou imóvel para registrar<\u002Ftd><td>Seção 14<\u002Ftd><\u002Ftr>\n        <tr><td>Cliente ou negociação travada<\u002Ftd><td>Seção 15<\u002Ftd><\u002Ftr>\n        <tr><td>Situação fora do padrão<\u002Ftd><td>Seção 15 + Seção 16<\u002Ftd><\u002Ftr>\n        <tr><td>Precisa de modelo de mensagem pronto<\u002Ftd><td>Seção 20<\u002Ftd><\u002Ftr>\n        <tr><td>Precisa de checklist rápido<\u002Ftd><td>Seção 19<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <div class=\"hl-box\" style=\"margin-top:20px;\">\n      <div class=\"hl-lbl\">Regra prática do corretor<\u002Fdiv>\n      <div class=\"hl-title\">Em dúvida sobre qual protocolo aplicar:<\u002Fdiv>\n      <div class=\"hl-body\">Para. Organiza as informações da Seção 6. Chama o Gerente Sunrise(Junior).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 3<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 4 -->\n<div class=\"page-block\" id=\"s4\">\n<div class=\"page-label\">Seção 4<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"04 Papéis e responsabilidades\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte A — Fundação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 4<\u002Fdiv>\n    <div class=\"h1\">Papéis e responsabilidades<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"h2\">4.1 — Tabela de responsabilidades<\u002Fdiv>\n    <table class=\"doc-table\">\n      <thead><tr><th>Atividade<\u002Fth><th>Responsável<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Negociação comercial<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Organização das informações mínimas<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Criação dos grupos de WhatsApp<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Primeira mensagem no grupo<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Acompanhamento do cliente até o fim<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Registro no C2S/Tecimob<\u002Ftd><td>Corretor<\u002Ftd><\u002Ftr>\n        <tr><td>Treinamento dos protocolos<\u002Ftd><td>Gerente Sunrise(Junior)<\u002Ftd><\u002Ftr>\n        <tr><td>Cobrança de protocolo<\u002Ftd><td>Gerente Sunrise(Junior)<\u002Ftd><\u002Ftr>\n        <tr><td>Intervenção em negociação travada<\u002Ftd><td>Gerente Sunrise(Junior)<\u002Ftd><\u002Ftr>\n        <tr><td>Registro de falha de protocolo<\u002Ftd><td>Gerente Sunrise(Junior)<\u002Ftd><\u002Ftr>\n        <tr><td>Solicitação documental no grupo<\u002Ftd><td>Depto Jurídico/Financeiro(Andressa)<\u002Ftd><\u002Ftr>\n        <tr><td>Preparação/validação da promessa de C&amp;V<\u002Ftd><td>Depto Jurídico/Financeiro(Andressa)<\u002Ftd><\u002Ftr>\n        <tr><td>Conferência de contrato com construtora<\u002Ftd><td>Depto Jurídico/Financeiro(Andressa)<\u002Ftd><\u002Ftr>\n        <tr><td>Orientação ITBI, escritura, registro, ONR<\u002Ftd><td>Depto Jurídico/Financeiro(Andressa)<\u002Ftd><\u002Ftr>\n        <tr><td>Emissão de nota fiscal e fluxo de comissão<\u002Ftd><td>Depto Jurídico/Financeiro(Andressa)<\u002Ftd><\u002Ftr>\n        <tr><td>Decisão estratégica e exceção de padrão<\u002Ftd><td>CEO(David)<\u002Ftd><\u002Ftr>\n        <tr><td>Aprovação de novos protocolos<\u002Ftd><td>CEO(David)<\u002Ftd><\u002Ftr>\n        <tr><td>Decisão sobre gargalos recorrentes<\u002Ftd><td>CEO(David)<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 4<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SEÇÃO 4 cont. — o que cada papel nunca faz -->\n<div class=\"page-block\">\n<div class=\"page-label\">Seção 4 (cont.)<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"04 O que cada papel nunca faz\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte A — Fundação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 4 · continuação<\u002Fdiv>\n    <div class=\"h1\">4.2 — O que cada papel nunca faz<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"role-grid\">\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Corretor — nunca faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>Conduz negociação relevante sozinho sem informar a gestão<\u002Fli>\n            <li>Abre grupo sem valor, imóvel, unidade e forma de pagamento definidos<\u002Fli>\n            <li>Aciona o Jurídico/Financeiro sem as informações da Seção 6<\u002Fli>\n            <li>Promete aprovação de crédito, uso de FGTS ou prazo de cartório/banco<\u002Fli>\n            <li>Libera entrega de chaves antes do pagamento total ao vendedor<\u002Fli>\n            <li>Deixa contrato de construtora ser assinado sem conferência do Jurídico<\u002Fli>\n            <li>Trata alteração de valor apenas no privado<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Gerente Sunrise(Junior) — nunca faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>Resolve tudo no improviso<\u002Fli>\n            <li>Repete a mesma orientação três vezes sem transformar em treinamento ou ajuste no manual<\u002Fli>\n            <li>Cobra corretor sobre protocolo que não foi treinado<\u002Fli>\n            <li>Deixa negociação importante avançar fora do padrão sem registrar<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Jurídico/Financeiro(Andressa) — nunca faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>Recebe negociação sem as informações da Seção 6<\u002Fli>\n            <li>Assume tarefa que deveria ter sido organizada pelo Corretor<\u002Fli>\n            <li>Valida contrato de construtora depois que já foi assinado sem conferência prévia<\u002Fli>\n            <li>É acionado antes de existir negociação real<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card gold\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">CEO(David) — nunca faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>É acionado para dúvida operacional simples<\u002Fli>\n            <li>Substitui o papel do Gerente Sunrise(Junior) ou do Jurídico/Financeiro<\u002Fli>\n            <li>Resolve caso a caso o que já deveria estar padronizado<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 4 — cont.<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE B OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte B<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte B — Quando a negociação começa\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">B<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte B · Seções 5–7<\u002Fdiv>\n    <div class=\"sec-title\">Quando a negociação começa<\u002Fdiv>\n    <div class=\"sec-desc\">Os gatilhos que transformam um atendimento comum em processo formal. As informações que precisam estar organizadas antes de qualquer passo seguinte. O padrão de grupos no WhatsApp.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">5<\u002Fspan><span class=\"ss-text\">Quando uma conversa vira negociação<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">6<\u002Fspan><span class=\"ss-text\">Informações mínimas obrigatórias<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">7<\u002Fspan><span class=\"ss-text\">Protocolo de grupos no WhatsApp<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte B<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 5 -->\n<div class=\"page-block\" id=\"s5\">\n<div class=\"page-label\">Seção 5<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"05 Quando uma conversa vira negociação\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte B — Quando a negociação começa<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 5<\u002Fdiv>\n    <div class=\"h1\">Quando uma conversa vira negociação<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Enquanto é atendimento comum, o Corretor trabalha no seu fluxo individual. A conversa <strong>vira negociação e entra nos protocolos deste manual<\u002Fstrong> quando acontece pelo menos uma destas situações:<\u002Fdiv>\n\n    <div class=\"gatilho-grid\">\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>1<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador <strong>pede para fazer proposta<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>2<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador <strong>pergunta como formalizar a compra<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>3<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador e vendedor já <strong>discutem valor entre si<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>4<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador aceita avançar para <strong>simulação de financiamento<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>5<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador <strong>confirma entrada e forma de pagamento<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>6<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Vendedor <strong>aceita valor ou apresenta contraproposta concreta<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>7<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Construtora <strong>recebe proposta ou contraproposta<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>8<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Cliente comprador pede <strong>documentos, contrato, dados bancários ou próximos passos<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div class=\"gatilho-item\"><div class=\"gatilho-num\"><span>9<\u002Fspan><\u002Fdiv><div class=\"gatilho-text\">Corretor percebe que existe <strong>intenção real de fechamento<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hl-box\" style=\"margin-top:14px;\">\n      <div class=\"hl-lbl\">A partir deste ponto<\u002Fdiv>\n      <div class=\"hl-title\">O Corretor sai do atendimento comum e entra no manual.<\u002Fdiv>\n      <div class=\"hl-body\">Qualquer conversa que tenha passado por um desses gatilhos precisa ter, em até <strong>24 horas<\u002Fstrong>, as informações da Seção 6 organizadas.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 5<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 6 -->\n<div class=\"page-block\" id=\"s6\">\n<div class=\"page-label\">Seção 6<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"06 Informações mínimas obrigatórias\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte B — Quando a negociação começa<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 6<\u002Fdiv>\n    <div class=\"h1\">Informações mínimas obrigatórias<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Antes de acionar o Gerente Sunrise(Junior) ou o Departamento Jurídico/Financeiro(Andressa), o Corretor organiza obrigatoriamente estas informações:<\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\">\n        <span class=\"copy-head-lbl\">Ficha interna · preencher antes de abrir grupo<\u002Fspan>\n        <span class=\"copy-tag\" onclick=\"copyFicha()\">Copiar<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"copy-body\" id=\"ficha-text\">NEGOCIAÇÃO EM ANDAMENTO\n\nCorretor responsável:\nTipo: [ ] à vista  [ ] financiamento  [ ] FGTS  [ ] construtora\nCliente comprador:\nTelefone:\nVendedor/construtora:\nImóvel/empreendimento:\nUnidade/apartamento:\nLink do imóvel:\nValor anunciado: R$\nValor negociado: R$\nEntrada: R$\nSaldo restante: R$\nForma de pagamento:\nFinanciamento: sim/não\nFGTS: sim/não\nAlguma parte fora de João Pessoa: sim/não\nEtapa atual:\nPróximo passo:<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stop-box\">\n      <div class=\"stop-lbl\">Regra de ouro desta seção<\u002Fdiv>\n      <div class=\"stop-body\"><strong>Sem essa ficha preenchida, o Corretor não aciona o Departamento Jurídico/Financeiro(Andressa) e não abre grupo.<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 6<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 7 -->\n<div class=\"page-block\" id=\"s7\">\n<div class=\"page-label\">Seção 7 · 1/2<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"07 Grupos no WhatsApp (1/2)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte B — Quando a negociação começa<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 7<\u002Fdiv>\n    <div class=\"h1\">Protocolo de grupos no WhatsApp<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"h2\">7.1 — Quando abrir grupo<\u002Fdiv>\n    <div class=\"body-p\">O grupo é aberto quando: há valor total, entrada e forma de pagamento negociados; a ficha da Seção 6 está completa; existe intenção real de fechar.<\u002Fdiv>\n    <div class=\"stop-box\">\n      <div class=\"stop-lbl\">Não se abre grupo<\u002Fdiv>\n      <div class=\"stop-body\">Apenas porque o cliente \"demonstrou interesse\" · Sem valor total, entrada e saldo definidos · Quando há dúvida se o cliente vai avançar<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">7.2 — Padrão de nomenclatura<\u002Fdiv>\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">Nome dos grupos — sempre dois grupos separados<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\">[Empreendimento/imóvel] - [Apto/unidade] - COMPRADOR\n[Empreendimento/imóvel] - [Apto/unidade] - VENDEDOR\n\nExemplo:\nSolar Atlântico - Apto 1204 - COMPRADOR\nSolar Atlântico - Apto 1204 - VENDEDOR<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">7.3 — Quem entra em cada grupo<\u002Fdiv>\n    <div class=\"role-grid\">\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Grupo do Comprador<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li>Cliente comprador (ou compradores)<\u002Fli>\n            <li>Corretor responsável<\u002Fli>\n            <li>Depto Jurídico/Financeiro(Andressa)<\u002Fli>\n            <li>Gerente Sunrise(Junior) — quando a negociação for relevante ou houver risco<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Grupo do Vendedor<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li>Vendedor (ou vendedores)<\u002Fli>\n            <li>Corretor responsável<\u002Fli>\n            <li>Depto Jurídico/Financeiro(Andressa)<\u002Fli>\n            <li>Gerente Sunrise(Junior) — quando necessário<\u002Fli>\n            <li>Representante autorizado do vendedor, se houver<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"info-box\" style=\"margin-top:14px;\">\n      <div class=\"info-lbl\">Não entra no grupo<\u002Fdiv>\n      <div class=\"info-body\">Terceiros sem função · familiares sem procuração formal · membros da Equipe Jampalife sem papel direto na negociação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 7 · 1/2<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\">\n<div class=\"page-label\">Seção 7 · 2/2<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"07 Grupos no WhatsApp (2/2)\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte B — Quando a negociação começa<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 7 · continuação<\u002Fdiv>\n    <div class=\"h1\">7.4 — Primeira mensagem no grupo<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Obrigatória e padronizada. Serve para registrar o combinado e abrir caminho para o Jurídico/Financeiro(Andressa) atuar.<\u002Fdiv>\n\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">Modelo · primeira mensagem no grupo (padrão único)<\u002Fspan><span class=\"copy-tag\" onclick=\"copyBlock('msg1-text')\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"msg1-text\">Pessoal, bom dia/boa tarde.\n\nCriei este grupo para organizarmos a negociação do imóvel abaixo:\n\nImóvel/empreendimento:\nUnidade/apartamento:\nValor total negociado: R$\nValor de entrada: R$\nValor restante/financiado: R$\nForma de pagamento:\nPróxima etapa prevista:\n\nO Departamento Jurídico/Financeiro(Andressa) vai orientar por aqui a documentação e os próximos passos do processo.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">7.5 — Conduta nos grupos<\u002Fdiv>\n    <div class=\"role-grid\">\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">O Corretor faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li>Mantém informações importantes no grupo, não no privado<\u002Fli>\n            <li>Responde rápido e com clareza<\u002Fli>\n            <li>Confirma recebimento de documentos por escrito<\u002Fli>\n            <li>Registra qualquer alteração de valor, condição ou prazo<\u002Fli>\n            <li>Avisa o grupo quando algo depender de banco, cartório ou construtora<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">O Corretor não faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>Discute comissão no grupo sem autorização da liderança<\u002Fli>\n            <li>Manda áudio longo em ponto sensível (prefere texto para registro)<\u002Fli>\n            <li>Altera condição sem registrar no grupo<\u002Fli>\n            <li>Promete prazo de banco, cartório ou prefeitura<\u002Fli>\n            <li>Deixa pergunta do cliente sem resposta por mais de 24 horas úteis<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 7 · 2/2<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE C OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte C<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte C — Protocolos por tipo\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">C<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte C · Seções 8–12<\u002Fdiv>\n    <div class=\"sec-title\">Protocolos por tipo de operação<\u002Fdiv>\n    <div class=\"sec-desc\">O fluxo comum a toda venda e os protocolos específicos para cada tipo: à vista, financiamento bancário, FGTS e construtora. Cada protocolo tem seus passos, seus alertas e seus pontos de parada.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">8<\u002Fspan><span class=\"ss-text\">Fluxo comum a todas as operações<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">9<\u002Fspan><span class=\"ss-text\">Protocolo de venda à vista<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">10<\u002Fspan><span class=\"ss-text\">Protocolo de venda com financiamento bancário<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">11<\u002Fspan><span class=\"ss-text\">Protocolo de financiamento com FGTS<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">12<\u002Fspan><span class=\"ss-text\">Protocolo de venda com construtora<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte C<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 8 + 9 -->\n<div class=\"page-block\" id=\"s8\">\n<div class=\"page-label\">Seção 8<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"08 Fluxo comum a todas as operações\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte C — Protocolos por tipo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 8<\u002Fdiv>\n    <div class=\"h1\">Fluxo comum a todas as operações<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Toda venda da Jampalife segue essa espinha — independente do tipo. As Seções 9 a 12 detalham as variações de cada tipo.<\u002Fdiv>\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\"><strong>Corretor negocia<\u002Fstrong> e organiza a ficha (Seção 6)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\"><strong>Corretor avisa<\u002Fstrong> o Gerente Sunrise(Junior)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\"><strong>Corretor abre os grupos<\u002Fstrong> com a primeira mensagem padrão (Seção 7)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro(Andressa) solicita documentos<\u002Fstrong> no grupo<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\"><strong>Documentação conferida<\u002Fstrong><\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\"><strong>Promessa de compra e venda<\u002Fstrong> preparada e assinada (quando aplicável)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">7<\u002Fdiv><div class=\"step-text\"><strong>Etapas específicas do tipo<\u002Fstrong> (banco, cartório, construtora)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">8<\u002Fdiv><div class=\"step-text\"><strong>Assinatura<\u002Fstrong> — presencial ou e-Notariado<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">9<\u002Fdiv><div class=\"step-text\"><strong>Pagamento e registro<\u002Fstrong><\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">10<\u002Fdiv><div class=\"step-text\"><strong>Entrega de chaves<\u002Fstrong> somente após pagamento integral ao vendedor (Seção 18)<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"hl-box\" style=\"margin-top:20px;\">\n      <div class=\"hl-lbl\">Regra de ouro<\u002Fdiv>\n      <div class=\"hl-title\">Nenhuma etapa é pulada.<\u002Fdiv>\n      <div class=\"hl-body\">Cada passo depende do anterior estar completo. Em dúvida sobre em qual etapa está, o Corretor aciona o Gerente Sunrise(Junior) antes de avançar.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 8<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\" id=\"s9\">\n<div class=\"page-label\">Seção 9<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"09 Venda à vista\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte C — Protocolos por tipo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 9<\u002Fdiv>\n    <div class=\"h1\">Protocolo de venda à vista<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\"><strong>Quando usar:<\u002Fstrong> cliente comprador e vendedor fecham sem financiamento bancário. Pode haver entrada + saldo na escritura.<\u002Fdiv>\n\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\"><strong>Corretor negocia<\u002Fstrong> e organiza a ficha (Seção 6)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\"><strong>Avisa o Gerente Sunrise(Junior)<\u002Fstrong> com a ficha preenchida<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\"><strong>Cria os dois grupos<\u002Fstrong> e envia a primeira mensagem padrão (Seção 7.4)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro(Andressa) solicita documentos<\u002Fstrong> nos dois grupos. Se houver pendência, é informada no grupo.<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro(Andressa) prepara a promessa<\u002Fstrong> de compra e venda<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\"><strong>Assinatura da promessa<\u002Fstrong> por todas as partes<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">7<\u002Fdiv><div class=\"step-text\"><strong>Cartório:<\u002Fstrong> entrada → ITBI → escritura → pagamento de taxas → minuta para conferência → assinatura → registro<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">8<\u002Fdiv><div class=\"step-text\"><strong>Antes da assinatura, confirma:<\u002Fstrong> todos estarão em João Pessoa? Alguma parte precisa de e-Notariado? Já tem cadastro?<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">9<\u002Fdiv><div class=\"step-text\"><strong>Entrega de chaves<\u002Fstrong> somente após o vendedor receber o valor total (Seção 18)<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"stop-box\" style=\"margin-top:14px;\">\n      <div class=\"stop-lbl\">Pare e não avance se...<\u002Fdiv>\n      <div class=\"stop-body\">Valor total/entrada/saldo não estão claros · Dúvida sobre localização das partes · Alteração de valor não registrada no grupo · Jurídico/Financeiro não validou a promessa<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 9<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 10 -->\n<div class=\"page-block\" id=\"s10\">\n<div class=\"page-label\">Seção 10<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"10 Financiamento bancário\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte C — Protocolos por tipo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 10<\u002Fdiv>\n    <div class=\"h1\">Protocolo de venda com financiamento bancário<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\"><strong>Negocia valores<\u002Fstrong> — valor total, entrada, valor financiado, banco de preferência, intenção de FGTS<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\"><strong>Simulação inicial<\u002Fstrong> — confirma compatibilidade de renda, entrada e valor. <em>Simulação não é aprovação final.<\u002Fem><\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\"><strong>Organiza a ficha<\u002Fstrong> (Seção 6) e avisa o Gerente Sunrise(Junior)<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\"><strong>Cria os grupos<\u002Fstrong> — primeira mensagem informa valor, entrada, financiado estimado, banco e FGTS<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro<\u002Fstrong> solicita documentação do comprador no grupo<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro<\u002Fstrong> solicita documentação do vendedor e do imóvel<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">7<\u002Fdiv><div class=\"step-text\"><strong>Envio ao banco<\u002Fstrong> para aprovação da carta de crédito. Corretor não promete prazo fixo<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">8<\u002Fdiv><div class=\"step-text\"><strong>Carta de crédito aprovada<\u002Fstrong> — registrar valor aprovado, forma de pagamento da entrada e saldo bancário<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">9<\u002Fdiv><div class=\"step-text\"><strong>Promessa de compra e venda<\u002Fstrong> validada e assinada<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">10<\u002Fdiv><div class=\"step-text\"><strong>Vistoria do engenheiro<\u002Fstrong> solicitada pelo banco — após aprovação, banco envia formulários<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">11<\u002Fdiv><div class=\"step-text\"><strong>Formulários<\u002Fstrong> preenchidos e assinados — banco prepara o contrato<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">12<\u002Fdiv><div class=\"step-text\"><strong>Alerta:<\u002Fstrong> banco pode avisar data de assinatura com 1 dia de antecedência ou no próprio dia<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">13<\u002Fdiv><div class=\"step-text\"><strong>Confirma localização<\u002Fstrong> das partes — presencial ou e-Notariado<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"info-box\" style=\"margin-top:8px;\">\n      <div class=\"info-lbl\">Caminho A — Assinatura presencial<\u002Fdiv>\n      <div class=\"info-body\">Assina → ITBI → quitação → cartório de registro (~5 dias úteis) → banco transfere ao vendedor (~2–3 dias úteis) → chaves<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"info-box\">\n      <div class=\"info-lbl\">Caminho B — e-Notariado<\u002Fdiv>\n      <div class=\"info-body\">Assina digitalmente → ITBI → quitação → registro ONR (~10–15 dias) → envio ao banco → transferência (~2–3 dias úteis) → chaves<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl-box\" style=\"margin:8px 0 0;\">\n      <div class=\"hl-lbl\">Atenção<\u002Fdiv>\n      <div class=\"hl-body\">Esses prazos são <strong>referência operacional interna<\u002Fstrong>, não promessa ao cliente comprador ou vendedor.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stop-box\" style=\"margin-top:8px;\">\n      <div class=\"stop-lbl\">Pare e não avance se...<\u002Fdiv>\n      <div class=\"stop-body\">Sem simulação compatível · Forma de pagamento da entrada não está clara · Carta de crédito não aprovada · Corretor prometeu prazo sem base<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 10<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 11 -->\n<div class=\"page-block\" id=\"s11\">\n<div class=\"page-label\">Seção 11<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"11 FGTS\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte C — Protocolos por tipo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 11<\u002Fdiv>\n    <div class=\"h1\">Protocolo de financiamento com FGTS<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <div class=\"stop-box\">\n      <div class=\"stop-lbl\">Regra inicial ao cliente comprador<\u002Fdiv>\n      <div class=\"stop-body\">O Corretor <strong>nunca garante<\u002Fstrong> uso de FGTS antes da validação. Frase de segurança: <em>\"Existe possibilidade de uso do FGTS, mas precisamos validar se você se enquadra nas regras e se o banco aprova.\"<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">11.3 — Informações que o Corretor levanta<\u002Fdiv>\n    <ul class=\"checklist\">\n      <li><div class=\"chk\"><\u002Fdiv>Possui financiamento habitacional ativo no nome?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Trabalha ou mora na cidade do imóvel?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Tem mais de 3 anos de registro/tempo de FGTS?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Possui algum imóvel em seu nome?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Tem comprovante de residência em João Pessoa (se imóvel for em JP)?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>Trabalha embarcado?<\u002Fli>\n      <li><div class=\"chk\"><\u002Fdiv>O imóvel será em João Pessoa ou outra cidade?<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">11.4 — Cenários de enquadramento (referência rápida)<\u002Fdiv>\n    <table class=\"doc-table\">\n      <thead><tr><th>Cenário<\u002Fth><th>Condição<\u002Fth><th>Observação<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>A<\u002Ftd><td>Financiamento habitacional ativo<\u002Ftd><td>Não pode usar FGTS<\u002Ftd><\u002Ftr>\n        <tr><td>B<\u002Ftd><td>Trabalha ou mora na cidade do imóvel<\u002Ftd><td>Pode, se tiver +3 anos de FGTS<\u002Ftd><\u002Ftr>\n        <tr><td>C<\u002Ftd><td>Não possui imóvel no nome<\u002Ftd><td>Pode comprovar residência de 1 mês em JP<\u002Ftd><\u002Ftr>\n        <tr><td>D<\u002Ftd><td>Trabalha embarcado<\u002Ftd><td>Pode usar comprovante de 1 mês em JP<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n    <div class=\"info-box\" style=\"margin-top:6px;\">\n      <div class=\"info-lbl\">Validação final<\u002Fdiv>\n      <div class=\"info-body\">Em todos os cenários, a validação final é do Departamento Jurídico/Financeiro(Andressa) e do banco.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"h2\">11.5 — Registro no grupo obrigatório<\u002Fdiv>\n    <div class=\"copy-block\">\n      <div class=\"copy-head\"><span class=\"copy-head-lbl\">Modelo · registro de FGTS no grupo<\u002Fspan><span class=\"copy-tag\" onclick=\"copyFGTS()\">Copiar<\u002Fspan><\u002Fdiv>\n      <div class=\"copy-body\" id=\"fgts-text\">Registrando que o cliente comprador informou intenção de utilizar FGTS.\n\nValor total: R$  |  Entrada: R$  |  Financiado: R$  |  FGTS previsto: R$\n\nO uso do FGTS ainda será validado conforme regras do banco e documentação do comprador.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stop-box\">\n      <div class=\"stop-lbl\">Pare e não avance se...<\u002Fdiv>\n      <div class=\"stop-body\">Corretor disse ao cliente que FGTS \"pode ser usado\" sem levantar as informações do item 11.3 · Financiamento ativo não foi checado · Intenção de FGTS não está registrada no grupo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 11<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 12 -->\n<div class=\"page-block\" id=\"s12\">\n<div class=\"page-label\">Seção 12<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"12 Venda com construtora\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte C — Protocolos por tipo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 12<\u002Fdiv>\n    <div class=\"h1\">Protocolo de venda com construtora<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n\n    <ol class=\"step-list\">\n      <li><div class=\"step-num\">1<\u002Fdiv><div class=\"step-text\"><strong>Corretor conhece o produto<\u002Fstrong> — empreendimento, unidade, metragem, tabela vigente, fluxo, comissão e regras da construtora<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">2<\u002Fdiv><div class=\"step-text\"><strong>Levar cliente à construtora<\u002Fstrong> quando possível — reduz ruído, confirma condições, aumenta confiança<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">3<\u002Fdiv><div class=\"step-text\"><strong>Corretor negocia<\u002Fstrong> — sinal, parcelas, intermediárias, financiamento, saldo de entrega, descontos, prazo<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">4<\u002Fdiv><div class=\"step-text\"><strong>Avisa o Jurídico/Financeiro(Andressa)<\u002Fstrong> com ficha da Seção 6 + contato da construtora + condições comerciais<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">5<\u002Fdiv><div class=\"step-text\"><strong>Solicita dados da imobiliária<\u002Fstrong> ao Jurídico/Financeiro(Andressa) para envio à construtora<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">6<\u002Fdiv><div class=\"step-text\"><strong>Envia à construtora<\u002Fstrong> documentos do comprador + dados da imobiliária<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">7<\u002Fdiv><div class=\"step-text\"><strong>Recebe o contrato<\u002Fstrong> → encaminha ao comprador para conferência comercial + ao Jurídico/Financeiro para conferência antes da assinatura<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">8<\u002Fdiv><div class=\"step-text\"><strong>Jurídico/Financeiro confere:<\u002Fstrong> dados Jampalife, comissão (valor/prazo/forma), informações comerciais, contato da construtora<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">9<\u002Fdiv><div class=\"step-text\"><strong>Assinatura<\u002Fstrong> somente após conferência<\u002Fdiv><\u002Fli>\n      <li><div class=\"step-num\">10<\u002Fdiv><div class=\"step-text\"><strong>Envia ao Jurídico/Financeiro:<\u002Fstrong> contrato assinado, contato da construtora, informações de NF e prazo de comissão<\u002Fdiv><\u002Fli>\n    <\u002Fol>\n\n    <div class=\"hl-box\">\n      <div class=\"hl-lbl\">Proteção da comissão — 12.3<\u002Fdiv>\n      <div class=\"hl-body\">Comissão só é considerada protegida quando: contrato foi conferido antes da assinatura · valor, forma e prazo de comissão constam no contrato · dados da Jampalife estão corretos · contato da construtora foi registrado · canal de emissão de NF definido.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stop-box\">\n      <div class=\"stop-lbl\">Pare e não avance se...<\u002Fdiv>\n      <div class=\"stop-body\">Corretor não conhece a tabela vigente · Dados da imobiliária não foram solicitados ao Jurídico · Contrato não passou por conferência antes da assinatura · Comissão não está clara no contrato · Sem contato direto com quem negociou na construtora<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 12<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ PARTE D OPENER -->\n<div class=\"page-block\">\n<div class=\"page-label\">Parte D<\u002Fdiv>\n<div class=\"a4 sec-opener\" data-screen-label=\"Parte D — Protocolos de apoio\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Jampalife Negócios Imobiliários · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec-body\">\n    <div class=\"sec-num\">D<\u002Fdiv>\n    <div class=\"sec-rule\"><\u002Fdiv>\n    <div class=\"sec-lbl\">Parte D · Seções 13–18<\u002Fdiv>\n    <div class=\"sec-title\">Protocolos de apoio<\u002Fdiv>\n    <div class=\"sec-desc\">Atividades que sustentam toda operação: captação e documentação, registro em sistemas, escalonamento, comunicação interna, regras inegociáveis e proteção de comissão.<\u002Fdiv>\n    <div class=\"sec-sections\">\n      <div class=\"sec-sections-lbl\">Seções desta parte<\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">13<\u002Fspan><span class=\"ss-text\">Documentação e captação<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">14<\u002Fspan><span class=\"ss-text\">Registro no C2S e no Tecimob<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">15<\u002Fspan><span class=\"ss-text\">Escalonamento<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">16<\u002Fspan><span class=\"ss-text\">Comunicação interna<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">17<\u002Fspan><span class=\"ss-text\">Regras inegociáveis<\u002Fspan><\u002Fdiv>\n      <div class=\"sec-section-item\"><span class=\"ss-num\">18<\u002Fspan><span class=\"ss-text\">Entrega de chaves e proteção de comissão<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno<\u002Fspan><span class=\"ft-pg\">Parte D<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÕES 13–16 -->\n<div class=\"page-block\" id=\"s13\">\n<div class=\"page-label\">Seção 13<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"13 Documentação e captação\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte D — Protocolos de apoio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 13<\u002Fdiv>\n    <div class=\"h1\">Documentação e captação<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Quem solicita e valida documentos jurídicos/financeiros é o Depto Jurídico/Financeiro(Andressa). O Corretor organiza, cobra e confirma. <strong>Captação sem documentação mínima não é contabilizada no Plano de Carreira.<\u002Fstrong><\u002Fdiv>\n\n    <div class=\"h2\">13.2 — Documentos mínimos para captação completa<\u002Fdiv>\n    <ul class=\"bullet-list\">\n      <li>Autorização de comercialização<\u002Fli>\n      <li>Matrícula ou escritura<\u002Fli>\n      <li>Boleto do IPTU<\u002Fli>\n      <li>Boleto do condomínio (quando houver)<\u002Fli>\n      <li>Documentos exigidos pelo CRECI<\u002Fli>\n      <li>Outros definidos pelo Depto Jurídico/Financeiro(Andressa)<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">13.3 — Como o Corretor pede documento<\u002Fdiv>\n    <div class=\"role-grid\">\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li>Orienta com clareza o que é necessário e por quê<\u002Fli>\n            <li>Envia pedido no grupo, não no privado<\u002Fli>\n            <li>Confere se o arquivo chegou legível<\u002Fli>\n            <li>Confirma o recebimento por escrito no grupo<\u002Fli>\n            <li>Cobra pendência com educação e objetividade<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Não faz<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"never-list\">\n            <li>Pede documento errado ou fora de ordem<\u002Fli>\n            <li>Deixa documento recebido sem registrar no grupo<\u002Fli>\n            <li>Aceita arquivo ilegível<\u002Fli>\n            <li>Adianta promessa sobre o que o documento garante<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"info-box\"><div class=\"info-lbl\">Modelos<\u002Fdiv><div class=\"info-body\">Pedido de documento → modelo 20.9 · Documento ilegível → modelo 20.10<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 13<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\" id=\"s14\">\n<div class=\"page-label\">Seções 14–15<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"14 C2S e Tecimob — 15 Escalonamento\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte D — Protocolos de apoio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 14<\u002Fdiv>\n    <div class=\"h1\">Registro no C2S e no Tecimob<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"hl-box\"><div class=\"hl-lbl\">Regra geral<\u002Fdiv><div class=\"hl-body\"><strong>O que não é registrado não pode ser acompanhado.<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n    <div class=\"role-grid\" style=\"margin-top:8px;\">\n      <div class=\"role-card\"><div class=\"role-card-hd\"><div class=\"role-card-title\">C2S — Contact2Sale<\u002Fdiv><\u002Fdiv><div class=\"role-card-body\"><ul class=\"bullet-list\"><li>Etapa do lead<\u002Fli><li>Imóveis apresentados e visitas<\u002Fli><li>Proposta feita · negociação iniciada<\u002Fli><li>Motivo de perda, quando houver<\u002Fli><li>Observações relevantes<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv>\n      <div class=\"role-card\"><div class=\"role-card-hd\"><div class=\"role-card-title\">Tecimob<\u002Fdiv><\u002Fdiv><div class=\"role-card-body\"><ul class=\"bullet-list\"><li>Dados do imóvel captado<\u002Fli><li>Documentação mínima da captação<\u002Fli><li>Atualizações de valor e disponibilidade<\u002Fli><li>Condições comerciais<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"s15\" style=\"margin-top:20px;\">\n      <div class=\"sec-tag\">Seção 15<\u002Fdiv>\n      <div class=\"h1\">Escalonamento<\u002Fdiv>\n      <div class=\"h1-rule\"><\u002Fdiv>\n      <div class=\"body-p\"><strong>Todo pedido de escalonamento vai acompanhado de 4 informações mínimas:<\u002Fstrong> (1) caso/negociação · (2) o que aconteceu · (3) o que já foi tentado · (4) o que se espera que a liderança decida. Ver modelo 20.13.<\u002Fdiv>\n      <table class=\"doc-table\">\n        <thead><tr><th>Quem aciona<\u002Fth><th>Aciona quem<\u002Fth><th>Quando<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Corretor<\u002Ftd><td>Gerente Sunrise(Junior)<\u002Ftd><td>Dúvida comercial · cliente travado · risco de perder venda · outro corretor envolvido<\u002Ftd><\u002Ftr>\n          <tr><td>Corretor<\u002Ftd><td>Jurídico/Financeiro(Andressa)<\u002Ftd><td>Contrato · documentos · financiamento · FGTS · construtora · comissão · risco jurídico<\u002Ftd><\u002Ftr>\n          <tr><td>Gerente Sunrise(Junior)<\u002Ftd><td>CEO(David)<\u002Ftd><td>Risco relevante · conflito sem solução · decisão fora do padrão · falha grave<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seções 14–15<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page-block\" id=\"s16\">\n<div class=\"page-label\">Seção 16<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"16 Comunicação interna\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte D — Protocolos de apoio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 16<\u002Fdiv>\n    <div class=\"h1\">Comunicação interna<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Toda comunicação importante precisa gerar pelo menos uma destas saídas:<\u002Fdiv>\n    <div class=\"role-grid\">\n      <div class=\"role-card gold\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Saídas válidas de toda comunicação<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li><strong>Decisão<\u002Fstrong> — o que foi resolvido<\u002Fli>\n            <li><strong>Tarefa<\u002Fstrong> — quem faz o quê e quando<\u002Fli>\n            <li><strong>Protocolo<\u002Fstrong> — nova regra ou ajuste no manual<\u002Fli>\n            <li><strong>Registro no grupo<\u002Fstrong> — informação formalizada<\u002Fli>\n            <li><strong>Registro no sistema<\u002Fstrong> — C2S ou Tecimob atualizado<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-card-hd\"><div class=\"role-card-title\">Modelos disponíveis<\u002Fdiv><\u002Fdiv>\n        <div class=\"role-card-body\">\n          <ul class=\"bullet-list\">\n            <li>Problema operacional → modelo 20.14<\u002Fli>\n            <li>Decisão tomada → modelo 20.15<\u002Fli>\n            <li>Pendência documental → modelo 20.16<\u002Fli>\n            <li>Escalonamento → modelo 20.13<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"info-box\" style=\"margin-top:10px;\"><div class=\"info-lbl\">Regra prática<\u002Fdiv><div class=\"info-body\">Se a comunicação não gerar nenhuma dessas saídas, provavelmente será esquecida. Registrar é responsabilidade de quem conduziu a conversa.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 16<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 17 -->\n<div class=\"page-block\" id=\"s17\">\n<div class=\"page-label\">Seção 17<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"17 Regras inegociáveis\">\n  <div class=\"pg-hd\">\n    <img src=\"\" data-logo=\"\" alt=\"Jampalife\" class=\"pg-hd-logo\">\n    <div class=\"pg-hd-info\">\n      <div class=\"doc-name\">Manual de Protocolo e Operações · v2<\u002Fdiv>\n      <div class=\"doc-date\">Parte D — Protocolos de apoio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pg-content\">\n    <div class=\"sec-tag\">Seção 17<\u002Fdiv>\n    <div class=\"h1\">Regras inegociáveis — o que o Corretor nunca faz<\u002Fdiv>\n    <div class=\"h1-rule\"><\u002Fdiv>\n    <div class=\"body-p\">Consolidação de todos os \"não fazer\" das seções anteriores. Referência única.<\u002Fdiv>\n\n    <div class=\"h2\">Condução da negociação<\u002Fdiv>\n    <ul class=\"never-list\">\n      <li>Conduz negociação relevante sem informar a gestão<\u002Fli>\n      <li>Abre grupo sem ficha da Seção 6 preenchida<\u002Fli>\n      <li>Aciona o Jurídico/Financeiro sem informações mínimas<\u002Fli>\n      <li>Altera condição da negociação fora do grupo<\u002Fli>\n      <li>Deixa pergunta do cliente sem resposta por mais de 24 horas úteis<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">Promessas indevidas<\u002Fdiv>\n    <ul class=\"never-list\">\n      <li>Promete aprovação de crédito<\u002Fli>\n      <li>Promete uso garantido de FGTS antes da validação<\u002Fli>\n      <li>Promete prazo fixo de banco, cartório, prefeitura ou construtora<\u002Fli>\n      <li>Cria expectativa falsa sobre preço, condição ou prazo<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">Documentação e contrato<\u002Fdiv>\n    <ul class=\"never-list\">\n      <li>Envia dados errados da imobiliária<\u002Fli>\n      <li>Deixa contrato de construtora ir para assinatura sem conferência<\u002Fli>\n      <li>Aceita documento ilegível<\u002Fli>\n      <li>Libera documento sensível fora do canal combinado<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">Pagamento e chaves<\u002Fdiv>\n    <ul class=\"never-list\">\n      <li>Libera chaves antes do pagamento total ao vendedor<\u002Fli>\n      <li>Deixa vendedor acreditar que o valor financiado entra antes do registro e da liberação do banco<\u002Fli>\n      <li>Trata alteração de valor apenas no privado<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"h2\">Postura<\u002Fdiv>\n    <ul class=\"never-list\">\n      <li>Discute internamente na frente do cliente<\u002Fli>\n      <li>Abandona a negociação depois que o grupo foi criado<\u002Fli>\n      <li>Pula o Gerente Sunrise(Junior) em problema comercial<\u002Fli>\n      <li>Pula o Jurídico/Financeiro em contrato ou documento<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <div class=\"pg-ft\">\n    <div class=\"pg-ft-info\"><span class=\"ft-text\">Jampalife · Uso interno · Confidencial<\u002Fspan><span class=\"ft-pg\">Seção 17<\u002Fspan><\u002Fdiv>\n    <div class=\"pg-ft-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════ SEÇÃO 18 -->\n<div class=\"page-block\" id=\"s18\">\n<div class=\"page-label\">Seção 18<\u002Fdiv>\n<div class=\"a4\" data-screen-label=\"18 Entrega de chaves e proteção de comissão\">\n  <div class=\"pg-h
